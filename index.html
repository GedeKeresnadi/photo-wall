<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<div id="lightbox" hidden>
  <button class="lb-close" aria-label="Close">Close</button>
  <button class="lb-nav lb-prev" aria-label="Previous photo">&lsaquo;</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="lb-nav lb-next" aria-label="Next photo">&rsaquo;</button>
</div>
<script src="app.js"></script>
</body>
</html>
